        <div class="field"><label>Good ${esc(U)}</label><div class="good-box" id="cfGood">0</div></div></div>
      ${st.rejects ? `<div class="field hidden" id="cfReasonWrap"><label>Reject reason <span class="req">*</span></label><div class="chips" id="cfReasons">${reasonsList.map(r => `<button type="button" class="chip ${curReasons.indexOf(r) > -1 ? 'on' : ''}" data-v="${esc(r)}">${esc(r)}</button>`).join('')}</div>
        <input id="cfReasonOther" placeholder="Other reason (added to the list)" value="${esc(curReasons.filter(r => reasonsList.indexOf(r) === -1).join('; '))}" style="margin-top:6px"></div>` : ''}
      <div class="fsec">Readings</div>
      ${allOk.length > 1 && !existing ? `<button type="button" class="btn btn-ghost btn-sm" id="cfAllOk" style="margin-bottom:10px">${ico('check')} All checks OK</button>` : ''}
      <div class="form-grid">${st.fields.map(f => fieldInput(f, filled[f.key].v, ctxOf(f))).join('')}
        <div class="field"><label for="cfOperator">Operator <span class="req">*</span>${opSrc ? `<span class="af">${esc(opSrc)}</span>` : ''}</label>
          <input id="cfOperator" class="${opSrc ? 'af-on' : ''}" list="cfOperator_l" data-new="${esc(st.operatorList)}" value="${esc(operator)}" maxlength="80" placeholder="Select or type the name"><datalist id="cfOperator_l">${mergeOptions(opList, operator ? [operator] : []).map(o => `<option value="${esc(o)}">`).join('')}</datalist></div></div>
      <div class="fsec">Photos</div>
      <div class="capture">${st.photos.map(p => `<div class="cap" data-photo="${p.key}" tabindex="0">${ico('cam')}<span>${esc(p.label)}</span></div>`).join('')}</div>
      <div class="fsec">Production Supervisor</div>
      ${existing && existing.Sup_Signature ? `<div class="note">Signed${existing.Sup_Signed_By ? ' by ' + esc(existing.Sup_Signed_By) : ''}. <button type="button" class="btn btn-ghost btn-sm" id="cfResign">Sign again</button></div>` : ''}
      <div id="cfSigWrap" class="${existing && existing.Sup_Signature ? 'hidden' : ''}"><div class="field" style="margin-bottom:10px"><label for="cfSupName">Supervisor’s name${supSrc ? `<span class="af">${esc(supSrc)}</span>` : ''}</label><input id="cfSupName" class="${supSrc ? 'af-on' : ''}" value="${esc(supName)}" maxlength="80" list="cfSupNames" autocomplete="off"><datalist id="cfSupNames">${supNames.map(o => `<option value="${esc(o)}">`).join('')}</datalist></div>${sigPadHtml('cfSig', 'Production Supervisor signs here')}</div>
      <div class="field"><label>Remarks</label><textarea id="cfRemarks" maxlength="1000">${esc(existing ? existing.Remarks : draft && draft.remarks || '')}</textarea></div>
      ${signedCard ? '<div class="field"><label>Why change a PQA-signed card <span class="req">*</span></label><input id="cfWhy" maxlength="300"></div>' : ''}
      <div class="form-error" id="cfErr"></div></div>
    <div class="modal-foot"><span class="hint grow" id="cfUploads"></span><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary btn-lg" id="cfSave">${editing ? 'Save changes' : 'Save ' + esc(st.short)}</button></div>`,
    { wide: true, sticky: true });
  const el = m.el;
  const pad = SignaturePad($('#cfSig', el));
  const uploads = {};   // key -> promise of fileId
  const cur = Object.assign({}, media);

  const goodNow = () => Math.max(0, num($('#cfTotal', el).value) - (st.rejects ? num($('#cfReject', el).value) : 0));
  const boxes = $('#cf_Total_Boxes', el), caps = $('#cf_Caps_Per_Box', el);
  if (boxes && existing && !blankV(existing.Total_Boxes)) boxes.dataset.touched = '1';
  const calcBoxes = () => {
    if (!boxes || !caps || boxes.dataset.touched) return;
    const c = num(caps.value), g = goodNow();
    boxes.value = c > 0 && g > 0 ? Math.ceil(g / c) : '';
    const tagEl = boxes.closest('.field').querySelector('label');
    if (!tagEl.querySelector('.af')) tagEl.insertAdjacentHTML('beforeend', '<span class="af">Good ÷ per box</span>');
  };
  if (boxes) boxes.addEventListener('input', () => { boxes.dataset.touched = '1'; });
  if (caps) caps.addEventListener('input', calcBoxes);
  // Serial numbers: the last is the first + good − 1, unless typed; the count is checked against good.
  const sFrom = $('#cf_Serial_From', el), sTo = $('#cf_Serial_To', el);
  if (sTo && existing && !blankV(existing.Serial_To)) sTo.dataset.touched = '1';
  const calcSerial = () => {
    if (!sFrom || !sTo) return;
    const g = goodNow(), from = sFrom.value.trim().toUpperCase();
    if (!sTo.dataset.touched) sTo.value = from && parseSerial(from) && g > 0 ? serialAt(from, g - 1) : '';
    const n = serialCount(from, sTo.value.trim().toUpperCase()), h = $('[data-hint="Serial_To"]', el);
    if (h) {
      h.textContent = !from ? '' : !n ? 'These don’t make a range (same letters, last after first).' : n === g ? fmtNum(n) + ' numbers — matches the good quantity.' : fmtNum(n) + ' numbers, but ' + fmtNum(g) + ' are good. Check.';
      h.classList.toggle('warn', !!from && n !== g);
    }
  };
  if (sTo) sTo.addEventListener('input', () => { sTo.dataset.touched = sTo.value ? '1' : ''; calcSerial(); });
  if (sFrom) sFrom.addEventListener('input', calcSerial);
  const good = () => { $('#cfGood', el).textContent = fmtNum(goodNow()); if (st.rejects) $('#cfReasonWrap', el).classList.toggle('hidden', !(num($('#cfReject', el).value) > 0)); calcBoxes(); calcSerial(); };
  ['#cfTotal', '#cfReject'].forEach(s => { const i = $(s, el); if (i) i.addEventListener('input', good); });
  good();
  wirePick(el);
  // Anything changed by hand loses its "filled in" mark.
  el.addEventListener('input', e => { const f = e.target.closest('.field'); if (f) { f.querySelectorAll('.af-on').forEach(x => x.classList.remove('af-on')); const t = f.querySelector('label .af'); if (t) t.remove(); } });
  $$('[data-now]', el).forEach(btn => btn.addEventListener('click', () => {
    const i = $('#' + btn.dataset.now, el), d = new Date();
    i.value = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    i.dispatchEvent(new Event('input', { bubbles: true }));
  }));
  // Readings: compared with earlier batches as they are typed.
  st.fields.filter(f => f.check).forEach(f => {
    const i = $('#cf_' + f.key, el), h = $(`[data-hint="${f.key}"]`, el);
    if (!i || !h) return;
    const past = pastNumbers(stageKey, batchNo, f.key), base = h.textContent;
    const show = () => {
      const r = readingCheck(i.value, past);
      const html = r ? esc(r.msg) + (r.fix !== null ? ` <button type="button" class="linkish" data-fix="${r.fix}">Use ${esc(fmtNum(r.fix))}</button>` : '') : esc(base);
      if (h._html === html) return;   // unchanged: keep the button under the finger
      h._html = html;
      h.classList.toggle('warn', !!r);
      h.innerHTML = html;
      const fx = $('[data-fix]', h);
      if (fx) {
        fx.addEventListener('mousedown', ev => ev.preventDefault());
        fx.addEventListener('click', () => { i.value = fx.dataset.fix; i.dispatchEvent(new Event('input', { bubbles: true })); saveDraft(); });
      }
    };
    i.addEventListener('input', show); i.addEventListener('blur', show);
    if (!blankV(i.value)) show();
  });
  if ($('#cfAllOk', el)) $('#cfAllOk', el).addEventListener('click', () => {
    allOk.forEach(f => { const box = $(`[data-key="${f.key}"]`, el); $$('.chip', box).forEach(c => c.classList.toggle('on', c.dataset.v === 'OK')); });
    saveDraft();
  });
  $$('[data-enum] .chip', el).forEach(c => c.addEventListener('click', () => {
    $$('.chip', c.parentNode).forEach(x => x.classList.remove('on')); c.classList.add('on');
    c.parentNode.classList.remove('af-on'); const t = c.closest('.field').querySelector('label .af'); if (t) t.remove();
  }));
  $$('#cfReasons .chip', el).forEach(c => c.addEventListener('click', () => c.classList.toggle('on')));
  const filmSel = $('#cf_Film', el);
  const showFilm = () => {
    const name = filmSel.value.trim(), f = S.D.films.find(x => String(x.Film).toUpperCase() === name.toUpperCase());
    // A new film: micron × width × margin from a name like 6.5X75X2.5.
    const mm = !f && name.toUpperCase().replace(/\s+/g, '').match(/^(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)X(\d+(?:\.\d+)?)/);
    const src = f || (mm ? { Micron: mm[1], Width: mm[2], Free_Margin: mm[3] } : {});
    st.fields.filter(x => x.type === 'auto').forEach(x => { const t = $('#cf_' + x.key, el); if (t) t.textContent = blankV(src[x.auto]) ? '—' : src[x.auto]; });
    const h = $('[data-hint="Film"]', el);
    if (h) h.textContent = name && !f ? 'New film — added to Films when you save.' : '';
  };
  if (filmSel) { filmSel.addEventListener('input', showFilm); filmSel.addEventListener('change', showFilm); if (!existing) showFilm(); }
  if ($('#cfResign', el)) $('#cfResign', el).addEventListener('click', () => { $('#cfSigWrap', el).classList.remove('hidden'); $('#cfResign', el).parentNode.remove(); setTimeout(pad.clear, 30); });

  function paintCap(key) {
    const cap = $(`[data-photo="${key}"]`, el), p = st.photos.find(x => x.key === key);
    const id = cur[key];
    let inner = `${ico('cam')}<span>${esc(p.label)}</span>`;
    if (cap._preview || (id && String(id).indexOf('missing:') !== 0)) {
      const src = cap._preview || mediaSrc(id, 400);
      inner = `<img ${src ? `src="${esc(src)}"` : ''} ${!cap._preview && id ? `data-mid="${esc(id)}" data-w="400"` : ''} alt=""><button type="button" class="cap-x" data-x="${key}" aria-label="Remove">${ico('x')}</button>` +
        `<span class="cap-state">${cap._state === 'up' ? '<span class="badge b-warn"><span class="spin" style="width:10px;height:10px"></span> uploading</span>' : cap._state === 'fail' ? '<span class="badge b-bad">upload failed — tap to retry</span>' : '<span class="badge b-ok">' + ico('check') + ' saved</span>'}</span>`;
    }
    cap.innerHTML = inner;
    hydrateProxyImages(cap);
    const x = $('[data-x]', cap);
    if (x) x.addEventListener('click', ev => { ev.stopPropagation(); cur[key] = ''; cap._preview = null; cap._state = null; delete uploads[key]; paintCap(key); saveDraft(); });
  }
  function updateUploads() {
    const n = st.photos.filter(p => { const c = $(`[data-photo="${p.key}"]`, el); return c && c._state === 'up'; }).length;
    $('#cfUploads', el).textContent = n ? 'Uploading ' + plural(n, 'photo') + '…' : '';
  }
  st.photos.forEach(p => {
    const cap = $(`[data-photo="${p.key}"]`, el);
    paintCap(p.key);
    cap.addEventListener('click', () => {
      const fi = $('#fileInput');
      fi.value = '';
      fi.onchange = async () => {
        const file = fi.files && fi.files[0];
        if (!file) return;
        cap._state = 'up'; cap._preview = URL.createObjectURL(file); paintCap(p.key); updateUploads();
        const job = (async () => {
          const blob = await compressImage(file);
          cap._preview = URL.createObjectURL(blob); paintCap(p.key);
          const id = await uploadBlob(blob, { batchNo, stage: stageKey, kind: p.key });
          cur[p.key] = id; return id;
        })();
        uploads[p.key] = job;
        job.then(() => { cap._state = 'ok'; paintCap(p.key); updateUploads(); saveDraft(); })
           .catch(e => { cap._state = 'fail'; paintCap(p.key); updateUploads(); toast('Photo upload: ' + e.message, true); });
      };
      fi.click();
    });
  });

  function collect() {
    const fields = {};
    st.fields.forEach(f => {
      if (f.type === 'auto') return;
      if (f.type === 'enum') { const on = $(`[data-key="${f.key}"] .chip.on`, el); fields[f.key] = on ? on.dataset.v : ''; return; }
      const i = $('#cf_' + f.key, el); if (!i) return;
      fields[f.key] = f.type === 'datetime' ? (i.value ? new Date(i.value).toISOString() : '') : pickValue(el, 'cf_' + f.key);
    });
    const reasons = st.rejects ? $$('#cfReasons .chip.on', el).map(c => c.dataset.v).concat(reasonSplit($('#cfReasonOther', el).value)) : [];
    return { fields, totalQty: $('#cfTotal', el).value, rejectQty: st.rejects ? $('#cfReject', el).value : 0, rejectReason: reasons.join('; '),
             operator: pickValue(el, 'cfOperator'), remarks: $('#cfRemarks', el).value, supName: $('#cfSupName', el) ? $('#cfSupName', el).value.trim() : '' };
  }
  const saveDraft = debounce(() => { if (editing) return; const c = collect(); c.media = cur; store(draftKey(batchNo, stageKey), c); }, 400);
  el.addEventListener('input', saveDraft); el.addEventListener('click', saveDraft);
  const txn = uuid();
  $('#cfSave', el).addEventListener('click', async (e) => {
    const err = $('#cfErr', el); err.textContent = '';
    const c = collect();
    const missing = st.fields.filter(f => f.required && f.type !== 'auto' && !c.fields[f.key]).map(f => f.label);
    if (missing.length) { err.textContent = 'Fill in: ' + missing.join(', ') + '.'; return; }
    if (!c.operator) { err.textContent = 'Enter the operator.'; return; }
    if (st.rejects && num(c.rejectQty) > 0 && !c.rejectReason) { err.textContent = 'Choose the reject reason.'; return; }
    const needSig = !(existing && existing.Sup_Signature && $('#cfSigWrap', el).classList.contains('hidden'));
    if (needSig && pad.isEmpty()) { err.textContent = 'The Production Supervisor must sign.'; return; }
    if (signedCard && !$('#cfWhy', el).value.trim()) { err.textContent = 'Say why a signed card is being changed.'; return; }
    if (st.rejects && num(c.rejectQty) > num(c.totalQty)) { err.textContent = 'Rejected can’t be more than the total.'; return; }
    const tIn = c.fields.Time_In ? new Date(c.fields.Time_In).getTime() : 0, tOut = c.fields.Time_Out ? new Date(c.fields.Time_Out).getTime() : 0;
    if (tIn && tOut && tOut < tIn) { err.textContent = 'Time out is before time in.'; return; }
    if ((tIn && tIn > Date.now() + 15 * 60000) || (tOut && tOut > Date.now() + 15 * 60000)) { err.textContent = 'A time is in the future.'; return; }
    // Things that are allowed but are usually a slip: asked about once, before saving.
    const warns = [];
    if (prevGood !== null && num(c.totalQty) > prevGood) warns.push('Total ' + fmtNum(c.totalQty) + ' ' + U + ' is more than ' + (conv ? 'the ' + fmtNum(prevGood) + ' capacitors the ' + fmtNum(prevGoodRaw) + ' good elements make' : 'the ' + fmtNum(prevGood) + ' good from ' + prevSt.name) + '.');
    st.fields.filter(f => f.check).forEach(f => { const r = readingCheck(c.fields[f.key], pastNumbers(stageKey, batchNo, f.key)); if (r) warns.push(f.label + ' ' + fmtNum(c.fields[f.key]) + (f.unit ? ' ' + f.unit : '') + ': ' + r.msg); });
    // New values are fine (they join the list); a near miss of one already there is asked about.
    const newVal = (label, v, list) => { if (!v || list.some(o => o.toUpperCase() === v.toUpperCase())) return; const near = nearName(v, list); if (near) warns.push(label + ' “' + v + '” is new. Did you mean “' + near + '”?'); };
    newVal('Operator', c.operator, opList);
    st.fields.filter(f => f.type === 'list').forEach(f => newVal(f.label, c.fields[f.key], mergeOptions(S.D.lists[f.list] || [], distinctPast([stageKey], f.key))));
    if (c.supName && supNames.length && !supNames.some(o => o.toUpperCase() === c.supName.toUpperCase())) { const near = nearName(c.supName, supNames); if (near) warns.push('Supervisor “' + c.supName + '”: did you mean “' + near + '”?'); }
    if (warns.length && !await confirmBox('Please check these before saving:', { title: 'Check before saving', eyebrow: st.name + ' — ' + batchNo, list: warns, ok: 'Save anyway', cancel: 'Go back' })) return;
    const done = btnBusy(e.currentTarget, Object.keys(uploads).length ? 'Finishing uploads…' : 'Saving…');
    try {
      await Promise.all(Object.values(uploads));
      const mediaOut = {};
      st.photos.forEach(p => { mediaOut[p.key] = cur[p.key] || ''; });
      if (needSig) mediaOut.Sup_Signature = await uploadBlob(await pad.toBlob(), { batchNo, stage: stageKey, kind: 'Sup_Signature' });
      const params = Object.assign({ batchNo, stage: stageKey, media: mediaOut, clientTxnId: editing ? undefined : txn }, c);
      if (editing) { params.rowId = existing.Row_ID; if (signedCard) params.reason = $('#cfWhy', el).value.trim(); }
      const d = await api('saveCard', params);
      d._stage = stageKey;
      store(draftKey(batchNo, stageKey));
      if (!editing) {
        const keep = { operator: c.operator, supName: c.supName, fields: {} };
        st.fields.filter(f => f.fill === 'device').forEach(f => { keep.fields[f.key] = c.fields[f.key]; });
        store(lastKey(stageKey), keep);
      }
      m.close(); applyResult(d); flushAlerts();
      toast(editing ? 'Saved.' : st.name + ' recorded for ' + batchNo + '. PQA has been told.' + (d.lists || d.films ? ' New drop-down values were added.' : ''), 'ok');
      if (S.route.page !== 'batch') go('#/batch/' + batchNo + '/' + stageKey);
    } catch (x) { err.textContent = x.message; } finally { done(); }
  });
}
ACT.record = (el) => openCardForm(el.dataset.b, el.dataset.s, false);
ACT['edit-card'] = (el) => openCardForm(el.dataset.b, el.dataset.s, true);

/* =========================================================================
   PQA: SIGN, HOLD, SEND BACK
   ========================================================================= */
function openPqaSign(batchNo, stageKey) {
  const b = S.batchBy[batchNo], st = stageByKey(stageKey), c = cardOf(batchNo, stageKey);
  if (!b || !c) return;
  const i = stages().indexOf(st);
  const readings = `<div class="readings">${reading('Total', fmtNum(c.Total_Qty), 'q')}${st.rejects ? reading('Rejected', fmtNum(c.Reject_Qty || 0), 'q ' + (num(c.Reject_Qty) ? 'bad' : '')) : ''}${reading('Good', fmtNum(c.Good_Qty), 'q good')}${reading('Operator', c.Operator)}
      ${st.fields.map(f => reading(f.label, fieldValue(f, c[f.key]))).join('')}${c.Reject_Reason ? reading('Reject reason', c.Reject_Reason) : ''}</div>`;
  const photos = st.photos.filter(p => c[p.key] && String(c[p.key]).indexOf('missing:') !== 0).map(p => `<div class="photo" data-act="lightbox" data-mid="${esc(c[p.key])}" data-cap="${esc(p.label)}">${img(c[p.key], 520)}<span>${esc(p.label)}</span></div>`).join('');
  const m = openModal(modalHead('PQA sign-off · Stage ' + st.no, st.name + ' — ' + batchNo, esc(b.Product_Name || b.Part_Code) + ' · recorded by ' + esc(nameOf(c.Recorded_By)) + ' ' + ago(c.Recorded_At)) +
    `<div class="modal-body">${readings}${c.Remarks ? `<div class="note">${esc(c.Remarks)}</div>` : ''}
      ${photos || c.Sup_Signature ? `<div class="photos" style="grid-template-columns:repeat(${Math.min(3, st.photos.length + 1)},1fr)">${photos}${c.Sup_Signature ? `<div class="sig" style="aspect-ratio:auto">${img(c.Sup_Signature, SIG_W)}<small>Supervisor${c.Sup_Signed_By ? ' · ' + esc(c.Sup_Signed_By) : ''}</small></div>` : ''}</div>` : ''}
      <div class="fsec">Your sign-off</div>${sigPadHtml('pqSig', 'PQA signs here')}
      <div class="field"><label>PQA remarks</label><input id="pqRemarks" maxlength="500" placeholder="Optional"></div><div class="form-error" id="pqErr"></div></div>
    <div class="modal-foot"><button class="btn btn-soft-bad" id="pqBack">${ico('undo')}Send back</button><button class="btn btn-ghost" id="pqHold">${ico('hold')}Hold batch</button><span class="grow"></span>
      <button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-ok btn-lg" id="pqSign">${ico('pqa')}Sign off</button></div>`, { wide: true, sticky: true });
  hydrateProxyImages(m.el);
  const pad = SignaturePad($('#pqSig', m.el));
  const txn = uuid();
  $('#pqSign', m.el).addEventListener('click', async (e) => {
    const err = $('#pqErr', m.el); err.textContent = '';
    if (pad.isEmpty()) { err.textContent = 'Sign in the box first.'; return; }
    const done = btnBusy(e.currentTarget, 'Signing…');
    try {
      const sig = await uploadBlob(await pad.toBlob(), { batchNo, stage: stageKey, kind: 'PQA_Signature' });
      const d = await api('pqaSign', { batchNo, stage: stageKey, signature: sig, remarks: $('#pqRemarks', m.el).value, clientTxnId: txn });
      d._stage = stageKey; m.close(); applyResult(d); flushAlerts();
      const nb = d.batch;
      toast(st.name + ' signed off for ' + batchNo + (nb.Status === 'Done' ? ' — the batch is complete.' : '.'), 'ok');
    } catch (x) { err.textContent = x.message; } finally { done(); }
  });
  $('#pqBack', m.el).addEventListener('click', async () => { m.close(); await sendBack(batchNo, stageKey); });
  $('#pqHold', m.el).addEventListener('click', async () => { m.close(); await toggleHold(batchNo); });
}
ACT['pqa-sign'] = (el) => openPqaSign(el.dataset.b, el.dataset.s);
async function toggleHold(batchNo) {
  const b = S.batchBy[batchNo], hold = !info(b).hold;
  let reason = '';
  if (hold) { reason = await reasonBox('Put ' + batchNo + ' on PQA hold', 'Why is it on hold?', { ok: 'Hold batch', danger: true, sub: 'Nothing more can be recorded or signed until PQA releases it.' }); if (reason === null) return; }
  else if (!await confirmBox('Release ' + batchNo + ' from PQA hold?', { title: 'Release hold', ok: 'Release' })) return;
  try { applyResult(await api('setHold', { batchNo, hold, reason })); flushAlerts(); toast(hold ? batchNo + ' is on hold.' : batchNo + ' released.', 'ok'); } catch (e) { toast(e.message, true); }
}
ACT.hold = (el) => toggleHold(el.dataset.b);
async function sendBack(batchNo, stageKey) {
  const st = stageByKey(stageKey), c = cardOf(batchNo, stageKey);
  const removing = signed(c);
  const reason = await reasonBox((removing ? 'Remove ' : 'Send back ') + st.name + ' — ' + batchNo, removing ? 'Why is this signed card being removed?' : 'What needs fixing?',
    { danger: true, ok: removing ? 'Remove card' : 'Send back', sub: 'The card is set aside and the stage has to be recorded again. Whoever recorded it is told by email.' });
  if (reason === null) return;
  try { const d = await api('voidCard', { batchNo, stage: stageKey, reason }); d._stage = stageKey; applyResult(d); flushAlerts(); toast(st.name + ' sent back.', 'ok'); } catch (e) { toast(e.message, true); }
}
ACT['send-back'] = (el) => sendBack(el.dataset.b, el.dataset.s);
ACT['clear-pqa'] = async (el) => {
  const reason = await reasonBox('Take back the PQA sign-off', 'Why?', { ok: 'Take back' });
  if (reason === null) return;
  try { const d = await api('clearPqa', { batchNo: el.dataset.b, stage: el.dataset.s, reason }); d._stage = el.dataset.s; applyResult(d); toast('Sign-off taken back.'); } catch (e) { toast(e.message, true); }
};

/* =========================================================================
   PDF, FG STOCK, QR, LIGHTBOX, SCAN, EXPORT
   ========================================================================= */

    stages().forEach(st => {
      const u = st.unit === 'capacitors' ? ' (capacitors)' : ' (elements)';
      const cols = [['Batch_No', 'Batch'], ['Recorded', 'Recorded'], ['By', 'Recorded by'], ['Total_Qty', 'Total' + u], ['Reject_Qty', 'Rejected' + u], ['Good_Qty', 'Good' + u], ['Reject_Reason', 'Reject reason'], ['Operator', 'Operator']]
        .concat(st.fields.map(f => [f.key, f.label + (f.unit ? ' (' + f.unit + ')' : '')])).concat([['PQA', 'PQA by'], ['PQAAt', 'PQA at'], ['Remarks', 'Remarks']]);
      sheets.push({ name: st.no + ' ' + st.name.replace(/&/g, 'and'), columns: cols.map(c => ({ key: c[0], label: c[1] })),
        rows: (S.D.cards[st.key] || []).filter(c => nos.has(c.Batch_No)).map(c => { const o = Object.assign({}, c, { Recorded: dt(c.Recorded_At), By: nameOf(c.Recorded_By), PQA: nameOf(c.PQA_By), PQAAt: dt(c.PQA_At) });
          st.fields.filter(f => f.type === 'datetime').forEach(f => { o[f.key] = dt(c[f.key]); }); return o; }) });
    });
    const d = await api('exportWorkbook', { filename: 'BatchCards', sheets });
    const bytes = Uint8Array.from(atob(d.base64), ch => ch.charCodeAt(0));
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([bytes], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' })); a.download = d.filename; a.click();
  } catch (e) { toast(e.message, true); } finally { done(); }
};

/* =========================================================================
   DROPDOWNS
   ========================================================================= */
function renderDropdowns() {
  setTitle('Manage', 'Dropdowns');
  if (!S.D.can.lists) return '<div class="card empty">You don’t have access to change dropdowns.</div>';
  const lists = Object.assign({}, ...['Customers', 'Ratings', 'Voltages', 'Winding MFD', 'Connections', 'Can Types', 'Assembly Types', 'Winding Machines', 'Winding Operators', 'Spray Operators', 'Heat Stabilizing Operators', 'Short Clearing Operators', 'Welding Operators', 'Pouring Operators', 'Testing Operators', 'Auditors', 'Core Sizes', 'Can Sizes', 'Wire Colours', 'Reject Reasons'].map(k => ({ [k]: S.D.lists[k] || [] })), S.D.lists);
  const names = Object.keys(lists);
  const cur = S.view.ddList || 'Products';
  const chip = (n, count) => `<button class="chip ${cur === n ? 'on' : ''}" data-act="ddpick" data-v="${esc(n)}">${esc(n)} <span class="faint">${count}</span></button>`;
  let body;
  if (cur === 'Products') {
    body = `<div class="card"><div class="card-head"><div><h3>Products</h3><p>Choosing a part code on a new batch fills these in. “Stock FG code” links it to Stock Management when the part code differs.</p></div><button class="btn btn-primary btn-sm" data-act="ddedit" data-k="product">${ico('plus')}Add product</button></div>
      <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Part code</th><th>Product</th><th>Rating</th><th>Voltage</th><th>Winding MFD</th><th class="num">Elements</th><th>Connection</th><th>Film</th><th>Core</th><th>Can</th><th>Stock FG code</th><th></th></tr></thead><tbody>
      ${S.D.products.slice().sort((a, b) => azCmp(a.Part_Code, b.Part_Code)).map(p => `<tr data-act="ddedit" data-k="product" data-id="${esc(p.Row_ID)}"><td class="mono"><b>${esc(p.Part_Code)}</b></td><td>${esc(p.Product_Name)}</td><td>${esc(p.Rating)}</td><td>${esc(p.Voltage)}</td><td>${esc(p.Winding_MFD)}</td><td class="num">${esc(p.Elements_Per_Cap)}</td><td>${esc(p.Connection)}</td><td>${esc(p.Film)}</td><td>${esc(p.Core_Size)}</td><td>${esc(p.Can_Size)}</td><td class="mono">${esc(p.Stock_FG_Code)}</td>
        <td><button class="icon-btn" data-act="dddel" data-k="product" data-id="${esc(p.Row_ID)}" title="Delete">${ico('trash')}</button></td></tr>`).join('')}</tbody></table></div></div>`;
  } else if (cur === 'Films') {
    body = `<div class="card"><div class="card-head"><div><h3>Films</h3><p>Choosing the film on Winding fills micron, width, margin, type and resistivity.</p></div><button class="btn btn-primary btn-sm" data-act="ddedit" data-k="film">${ico('plus')}Add film</button></div>
      <div class="tbl-wrap" style="margin-top:12px"><table class="tbl"><thead><tr><th>Film</th><th>Micron</th><th>Width</th><th>Free margin</th><th>Type</th><th>Resistivity</th><th></th></tr></thead><tbody>
      ${S.D.films.map(f => `<tr data-act="ddedit" data-k="film" data-id="${esc(f.Row_ID)}"><td class="mono"><b>${esc(f.Film)}</b></td><td>${esc(f.Micron)}</td><td>${esc(f.Width)}</td><td>${esc(f.Free_Margin)}</td><td>${esc(f.Film_Type)}</td><td>${esc(f.Film_Resistivity)}</td>
        <td><button class="icon-btn" data-act="dddel" data-k="film" data-id="${esc(f.Row_ID)}" title="Delete">${ico('trash')}</button></td></tr>`).join('')}</tbody></table></div></div>`;
  } else {
    const vals = lists[cur] || [];
    body = `<div class="card" style="max-width:720px"><div class="card-head"><div><h3>${esc(cur)}</h3><p>${plural(vals.length, 'value')}</p></div></div>
      <div class="dd-add"><input class="input" id="ddNew" placeholder="New value" maxlength="120"><button class="btn btn-primary" data-act="ddadd">Add</button></div>
      ${vals.map((v, i) => `<div class="dd-row"><span class="grow">${esc(v)}</span>
        <button class="icon-btn" data-act="ddmove" data-v="${esc(v)}" data-d="-1" ${i === 0 ? 'disabled' : ''} title="Up">${ico('up')}</button><button class="icon-btn" data-act="ddmove" data-v="${esc(v)}" data-d="1" ${i === vals.length - 1 ? 'disabled' : ''} title="Down">${ico('down')}</button>
        <button class="icon-btn" data-act="ddrename" data-v="${esc(v)}" title="Rename">${ico('edit')}</button><button class="icon-btn" data-act="dddelv" data-v="${esc(v)}" title="Delete">${ico('trash')}</button></div>`).join('') || '<div class="empty">Empty — add the first value above.</div>'}</div>`;
  }
  return `<div class="dd-picker">${chip('Products', S.D.products.length)}${chip('Films', S.D.films.length)}${names.map(n => chip(n, (lists[n] || []).length)).join('')}</div>${body}`;
}
afterRender.dropdowns = () => { const n = $('#ddNew'); if (n) n.addEventListener('keydown', e => { if (e.key === 'Enter') ACT.ddadd(); }); };
ACT.ddpick = (el) => { S.view.ddList = el.dataset.v; render(); };
async function ddSave(params, ok) { try { applyResult(await api('saveList', Object.assign({ list: S.view.ddList }, params))); if (ok) toast(ok, 'ok'); } catch (e) { toast(e.message, true); } }
ACT.ddadd = () => { const v = $('#ddNew').value.trim(); if (v) ddSave({ op: 'add', value: v }, 'Added ' + v + '.'); };
ACT.ddmove = (el) => ddSave({ op: 'move', value: el.dataset.v, dir: Number(el.dataset.d) });
ACT.ddrename = async (el) => { const nv = await reasonBox('Rename ' + el.dataset.v, 'New value', { ok: 'Rename', eyebrow: S.view.ddList, placeholder: el.dataset.v }); if (nv) ddSave({ op: 'rename', value: el.dataset.v, newValue: nv }, 'Renamed.'); };
ACT.dddelv = async (el) => { if (await confirmBox('Delete “' + el.dataset.v + '” from ' + S.view.ddList + '? Cards that already use it keep it.', { title: 'Delete value', ok: 'Delete', danger: true })) ddSave({ op: 'delete', value: el.dataset.v }, 'Deleted.'); };
ACT.dddel = async (el, e) => {
  e.stopPropagation();
  const kind = el.dataset.k, rec = (kind === 'film' ? S.D.films : S.D.products).find(x => x.Row_ID === el.dataset.id);
  if (!await confirmBox('Delete ' + (kind === 'film' ? rec.Film : rec.Part_Code) + '?', { title: 'Delete ' + kind, ok: 'Delete', danger: true })) return;
  try { applyResult(await api('deleteRecord', { kind, Row_ID: el.dataset.id })); toast('Deleted.'); } catch (x) { toast(x.message, true); }
};
ACT.ddedit = async (el, e) => {
  if (e.target.closest('[data-act=dddel]')) return;
  const kind = el.dataset.k, rec = el.dataset.id ? (kind === 'film' ? S.D.films : S.D.products).find(x => x.Row_ID === el.dataset.id) : {};
  const fieldsDef = kind === 'film'
    ? [['Film', 'Film', 'text', true], ['Micron', 'Micron'], ['Width', 'Width'], ['Free_Margin', 'Free margin'], ['Film_Type', 'Film type', 'select', false, ['SERIES', 'SLOPE WC', 'STANDARD', 'WAVE CUT']], ['Film_Resistivity', 'Film resistivity']]
    : [['Part_Code', 'Part code', 'text', true], ['Product_Name', 'Product name'], ['Rating', 'Rating', 'list', false, 'Ratings'], ['Voltage', 'Voltage', 'list', false, 'Voltages'], ['Winding_MFD', 'Winding element MFD', 'list', false, 'Winding MFD'],
       ['Elements_Per_Cap', 'Elements per capacitor', 'int'], ['Connection', 'Connection', 'list', false, 'Connections'],
       ['Film', 'Film', 'film'], ['Core_Size', 'Core size', 'list', false, 'Core Sizes'], ['Can_Size', 'Can size', 'list', false, 'Can Sizes'], ['Stock_FG_Code', 'Stock FG code (if different)', 'fg']];
  const input = (f) => {
    const v = rec[f[0]] || '';
    if (f[2] === 'select') return `<select id="dd_${f[0]}">${blankOption(f[1], f[3])}${f[4].map(o => `<option ${o === v ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    // Type-or-pick: a value that isn't in the list yet is added to it on save.
    if (f[2] === 'list') return `<input id="dd_${f[0]}" list="dd_${f[0]}_l" data-new="${esc(f[4])}" value="${esc(v)}" autocomplete="off" maxlength="120"><datalist id="dd_${f[0]}_l">${(S.D.lists[f[4]] || []).map(o => `<option value="${esc(o)}">`).join('')}</datalist>`;
    if (f[2] === 'film') return `<input id="dd_${f[0]}" class="mono" list="dd_${f[0]}_l" data-new="Films" value="${esc(v)}" autocomplete="off" maxlength="60" placeholder="Select or type"><datalist id="dd_${f[0]}_l">${S.D.films.map(x => `<option value="${esc(x.Film)}">${esc([x.Film_Type, x.Micron ? x.Micron + ' µ' : ''].filter(Boolean).join(' · '))}</option>`).join('')}</datalist>`;
    if (f[2] === 'int') return `<input id="dd_${f[0]}" type="number" inputmode="numeric" min="1" max="999" step="1" value="${esc(v)}" placeholder="e.g. 3">`;
    if (f[2] === 'fg') return `<input id="dd_${f[0]}" list="dd_fg_l" value="${esc(v)}" autocomplete="off" placeholder="Only if Stock uses another code"><datalist id="dd_fg_l"></datalist>`;
    return `<input id="dd_${f[0]}" value="${esc(v)}" maxlength="120">`;
  };
  const m = openModal(modalHead(kind === 'film' ? 'Films' : 'Products', rec.Row_ID ? 'Edit ' + (rec.Film || rec.Part_Code) : 'Add ' + kind) +
    `<div class="modal-body"><div class="form-grid">${fieldsDef.map(f => `<div class="field ${f[0] === 'Product_Name' ? 'full' : ''}"><label>${esc(f[1])}${f[3] ? ' <span class="req">*</span>' : ''}</label>${input(f)}</div>`).join('')}</div><div class="form-error" id="ddErr"></div></div>
     <div class="modal-foot"><button class="btn btn-ghost" data-close>Cancel</button><button class="btn btn-primary" id="ddSave">Save</button></div>`);
  if (kind === 'product') {
    (S.fgCatalog ? Promise.resolve(S.fgCatalog) : api('getFgCatalog', {}).then(d => (S.fgCatalog = d.items))).then(items => {
      const dl = $('#dd_fg_l', m.el); if (dl) dl.innerHTML = items.map(it => `<option value="${esc(it[0])}">${esc(it[1])}</option>`).join('');
    }).catch(() => {});
  }
  $('#ddSave', m.el).addEventListener('click', async (ev) => {
    const p = { Row_ID: rec.Row_ID || '' };
    fieldsDef.forEach(f => { p[f[0]] = $('#dd_' + f[0], m.el).value.trim(); });
    const done = btnBusy(ev.currentTarget);
    if (p.Elements_Per_Cap && !(Math.round(num(p.Elements_Per_Cap)) === num(p.Elements_Per_Cap) && num(p.Elements_Per_Cap) >= 1 && num(p.Elements_Per_Cap) <= 999)) { $('#ddErr', m.el).textContent = 'No. of elements per capacitor must be a whole number from 1 to 999.'; done(); return; }
    try { const d = await api(kind === 'film' ? 'saveFilm' : 'saveProduct', p); applyResult(d); m.close(); toast('Saved.' + (d.lists || (kind === 'product' && d.films) ? ' New drop-down values were added.' : ''), 'ok'); } catch (x) { $('#ddErr', m.el).textContent = x.message; } finally { done(); }
  });
};

/* =========================================================================
   GO
   ========================================================================= */
(function init() {
  setTheme(document.documentElement.getAttribute('data-theme') || 'light');
  setZoom(currentZoom());
  wire();
  // Install and update prompts (shared/app-prompts.js); they register the service worker too.
  AppPrompts.init({
    name: 'Batch Card Tracker', key: 'bct_ap_', version: APP_VERSION,
    icon: 'https://calgas.github.io/Stock-Management/logo/icon-192.png',
    perks: ['Opens full-screen, straight from your home screen', 'Starts at once, even on a weak signal', 'Batch and PQA alerts arrive on this device'],
    isReady: () => !!S.session && !$('#appView').classList.contains('hidden'),
    isBusy: () => layers().some(l => l._isForm && l._isForm())
  });
  S.session = load(SESSION_KEY, true);
  if (!S.session || !S.session.token) { showLogin(''); return; }
  handleNotifLink();
  showSplash();
  start();
})();

</script>
